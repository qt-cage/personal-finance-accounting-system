server:
  port: 8088

spring:
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 200ms
    connect-timeout: 200ms
  config:
    import: optional:file:${user.home}/.personal-finance/application.properties
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/finance_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:}}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  bill-files:
    max-user-storage-bytes: ${BILL_FILE_USER_QUOTA_BYTES:104857600}
  cache:
    enabled: ${FINANCE_CACHE_ENABLED:false}
    namespace: ${FINANCE_CACHE_NAMESPACE:finance:aggregate}
    ttl-seconds: 60
  recurring:
    enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  avatar:
    storage-dir: ${AVATAR_STORAGE_DIR:./uploads/avatars}
    max-file-size: 2097152
